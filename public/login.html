<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Automatiuh | Iniciar Sesión</title>

    <link rel="stylesheet" href="css/styles.css">

</head>

<body>

    <main class="contenedor-login">

        <section class="tarjeta-login">

            <img
                src="imagenes/banner-automatiuh-1.png"
                alt="Automatiuh Automatización Industrial"
                class="logo-login"
            >

            <h1>Iniciar Sesión</h1>

            <p class="descripcion-login">

                Accede al sistema de gestión de productos industriales de Automatiuh.

            </p>

            <form id="formLogin">

                <div class="campo">

                    <label for="email">

                        Correo Electrónico

                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="correo@ejemplo.com"
                        required
                    >

                </div>

                <div class="campo">

                    <label for="password">

                        Contraseña

                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Ingresa tu contraseña"
                        required
                    >

                </div>

                <p id="mensajeError"></p>

                <button type="submit">

                    Iniciar Sesión

                </button>

            </form>

        </section>

    </main>

    <script src="js/login.js"></script>

</body>

</html>
